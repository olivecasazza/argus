apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-forwarder
  labels:
    app.kubernetes.io/name: argus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: forwarder
spec:
  replicas: 1
  # The proposals PVC is RWO (SQLite HITL state). RollingUpdate surges a second
  # pod that can't Multi-Attach the volume and deadlocks the rollout; Recreate
  # terminates the old pod first so the new one can mount.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: argus
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forwarder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: argus
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: forwarder
      annotations:
        # Roll on forwarder.py change — ConfigMap updates don't restart pods on their own.
        checksum/forwarder: {{ sha256sum (.Files.Get "files/forwarder.py") }}
    spec:
      serviceAccountName: {{ include "argus.forwarderServiceAccountName" . }}
      {{- with .Values.forwarder.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: deps
          image: "{{ .Values.forwarder.image.repository }}:{{ .Values.forwarder.image.tag }}"
          imagePullPolicy: {{ .Values.forwarder.image.pullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              python -m venv /deps/venv
              /deps/venv/bin/pip install --quiet --no-cache-dir aiohttp discord.py
          volumeMounts:
            - name: deps
              mountPath: /deps
          resources:
            {{- toYaml .Values.forwarder.resources | nindent 12 }}
      containers:
        - name: forwarder
          image: "{{ .Values.forwarder.image.repository }}:{{ .Values.forwarder.image.tag }}"
          imagePullPolicy: {{ .Values.forwarder.image.pullPolicy }}
          command: ["/deps/venv/bin/python"]
          args: ["/app/forwarder.py"]
          env:
            - name: HOLMES_URL
              value: {{ .Values.forwarder.holmesUrl | quote }}
            - name: HOLMES_MODEL
              value: {{ .Values.forwarder.holmesModel | quote }}
            - name: HOLMES_TIMEOUT_SEC
              value: {{ .Values.forwarder.holmesTimeoutSec | quote }}
            - name: INVESTIGATE_SEVERITIES
              value: {{ .Values.forwarder.investigateSeverities | quote }}
            - name: DEDUPE_TTL_SEC
              value: {{ .Values.forwarder.dedupeTtlSec | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.forwarder.logLevel | quote }}
            # --- Phase 2: multi-channel routing (from discordChannels map) ---
            # Only emit per-channel env vars when explicitly set — otherwise
            # the forwarder's os.environ.get(..., default) falls back to
            # DISCORD_WEBHOOK_DEFAULT for critical/warning and skips info/deals.
            - name: DISCORD_WEBHOOK_DEFAULT
              {{- if .Values.forwarder.discordChannels.default }}
              value: {{ .Values.forwarder.discordChannels.default | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwarder.discordSecret.name | quote }}
                  key: {{ .Values.forwarder.discordSecret.key | quote }}
              {{- end }}
            {{- $chanMap := dict "critical" .Values.forwarder.discordChannels.critical "warning" .Values.forwarder.discordChannels.warning "info" .Values.forwarder.discordChannels.info "deals" .Values.forwarder.discordChannels.deals }}
            {{- range $k, $v := $chanMap }}
            {{- if $v }}
            - name: DISCORD_WEBHOOK_{{ $k | upper }}
              value: {{ $v | quote }}
            {{- end }}
            {{- end }}
            # --- Phase 3: repo mapping as JSON ---
            - name: REPO_MAPPINGS
              value: {{ .Values.forwarder.repoMappings | toJson | quote }}
            # --- Phase 4: HITL bot + GitHub merge-on-approve ---
            # Both optional; forwarder degrades gracefully when absent.
            {{- if .Values.forwarder.discordBotToken }}
            - name: DISCORD_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwarder.discordBotToken.name | quote }}
                  key: {{ .Values.forwarder.discordBotToken.key | quote }}
            {{- end }}
            {{- if .Values.forwarder.discordControlChannelId }}
            - name: DISCORD_CONTROL_CHANNEL_ID
              value: {{ .Values.forwarder.discordControlChannelId | quote }}
            {{- end }}
            {{- if .Values.forwarder.githubToken }}
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwarder.githubToken.name | quote }}
                  key: {{ .Values.forwarder.githubToken.key | quote }}
            {{- end }}
            # --- Changelog channel (activity feed + change ledger) ---
            # Webhook is a credential -> secretKeyRef only. Optional; forwarder
            # skips changelog posts when unset.
            {{- if .Values.forwarder.changelogWebhookSecret }}
            - name: DISCORD_WEBHOOK_CHANGELOG
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forwarder.changelogWebhookSecret.name | quote }}
                  key: {{ .Values.forwarder.changelogWebhookSecret.key | quote }}
            {{- end }}
            - name: PROPOSALS_DB
              value: {{ .Values.forwarder.proposalsDbPath | default "/data/proposals.db" | quote }}
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: deps
              mountPath: /deps
            - name: code
              mountPath: /app
              readOnly: true
            {{- if .Values.forwarder.proposalsStorage.enabled }}
            - name: proposals
              mountPath: /data
            {{- end }}
          resources:
            {{- toYaml .Values.forwarder.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: deps
          emptyDir: {}
        - name: code
          configMap:
            name: {{ .Release.Name }}-forwarder-code
        {{- if .Values.forwarder.proposalsStorage.enabled }}
        - name: proposals
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-forwarder-proposals
        {{- end }}
      {{- with .Values.forwarder.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.forwarder.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.forwarder.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
